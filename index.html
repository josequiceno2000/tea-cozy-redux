<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/media/tea-cozy-favicon2.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Tea Cozy</title>
</head>
<body>
    <header>    
        <div class="header-left">
            <a href="#">
                <img src="assets/media/tea-cozy-logo.webp" alt="Tea Cozy Logo">
            </a>
        </div>

        <div class="header-right">
            <nav>
                <ul>
                    <li>
                        <a href="#">Mission</a>
                    </li>
                    <li>
                        <a href="#">Featured Tea</a>
                    </li>
                    <li>
                        <a href="#">Locations</a>
                    </li>
                </ul>
            </nav>
        </div>
        
    </header>

    <main>
        <section class="hero">
            <div class="hero-background">
                <img src="assets/media/mission-background.webp" alt="Herbs in mason jar">
            </div>

            <div class="mission">
                <h2 class="section-title">Our Mission</h2>
                <span class="mission-tag">Handpicked</span>
                <span class="mission-tag">Artisinally Curated</span>
                <span class="mission-tag">Free Range</span>
                <span class="mission-tag">Sustainable</span>
                <span class="mission-tag">Small Batch</span>
                <span class="mission-tag">Fair Trade</span>
                <span class="mission-tag">Organic</span>
            </div>

        </section>

        <section id="tea-month">
            <h2 class="section-title" id="tea-month-title">Tea of the Month</h2>
            <span class="subtitle">What's Steeping at the Tea Cozy?</span>
            <div class="month-card">
                <figure>
                    <img src="assets/media/berryblitz.webp" alt="Berry Blitz tea" class="month-card-image">
                    <figcaption class="month-card-caption">Fall Berry Blitz Tea</figcaption>
                </figure>
            </div>
            <div class="month-card">
                <figure>
                    <img src="assets/media/spiced-rum.webp" alt="Spiced Rum Tea" class="month-card-image">
                    <figcaption class="month-card-caption">Spiced Rum Tea</figcaption>
                </figure>
            </div>
            <div class="month-card">
                <figure>
                    <img src="assets/media/donut.webp" alt="Seasonal Donuts" class="month-card-image">
                    <figcaption class="month-card-caption">Seasonal Donuts</figcaption>
                </figure>
            </div>
            <div class="month-card">
                <figure>
                    <img src="assets/media/myrtle-ave.webp" alt="Myrtle Ave Tea" class="month-card-image">
                    <figcaption class="month-card-caption">Myrtle Ave Tea</figcaption>
                </figure>
            </div>
            <div class="month-card">
                <figure>
                    <img src="assets/media/bedford-bizarre.webp" alt="Bedford Bizarre Tea" class="month-card-image">
                    <figcaption class="month-card-caption">Bedford Bizarre  Tea</figcaption>
                </figure>
            </div>
        </section>

        <section class="locations">
            <div class="locations-background">
                <img src="assets/media/locations-background.webp" alt="Table with a chair and tea in the foreground">
            </div>

            <div class="locations-content">
                <h2 class="section-title">Location</h2>
                <div class="location-map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3862630.7185210427!2d-4.729246823296283!3d52.19060227037992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487ebc82bc03b951%3A0x1883dbc54956c4ec!2sBettys%20Caf%C3%A9%20Tea%20Rooms!5e0!3m2!1sen!2sus!4v1788793253057!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>

        </section>
    </main>
    
    <footer>
        <div class="contact-info">
            <h2 class="footer-title">The Tea Cozy</h2>
            <p class="email">contact@teacozy.com</p>
            <p class="phone">555-231-5689</p>
        </div>

        <div class="copyright-section">
            <p>&#169; The Tea Cozy 2017</p>
            <a target="_blank" href="https://icons8.com/icon/102235/tea">Tea</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a>
        </div>
    </footer>
</body>
</html>
